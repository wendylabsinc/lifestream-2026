<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Ethereal Flow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Cpath d='M4 18C10 6 20 26 28 10' fill='none' stroke='%2349efff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .lil-gui {
            --background-color: rgba(9, 10, 18, 0.78);
            --widget-color: rgba(255, 255, 255, 0.12);
            --hover-color: rgba(255, 255, 255, 0.18);
            --focus-color: rgba(71, 233, 255, 0.32);
            --text-color: rgba(246, 251, 255, 0.94);
            --title-background-color: rgba(18, 20, 34, 0.9);
            --number-color: #8fefff;
            --string-color: #e7d5ff;
            backdrop-filter: blur(16px);
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import GUI from 'lil-gui';

        const config = {
            waveSpeed: 0.972,
            curlFrequency: 0.2625,
            writhingAmplitude: 1.4,

            offsetX: 0.24,
            offsetY: -1.23,
            groupSpacing: 4.0,
            taperSharpness: 4.248,

            tentacleCount: 9,
            coreLinesPerTentacle: 5,
            glowLinesPerTentacle: 45,
            spread: 0.6027,

            particleCount: 3100,
            particleSize: 0.04802,
            particleSpeed: 0.002,
            particleGlobalSpeed: 0.515,
            particleOrbitRadius: 0.42,
            particleOrbitSpeed: 0.9,

            bloomStrength: 1.55,
            bloomRadius: 0.74,
            bloomThreshold: 0.02,
            coreOpacity: 0.72,
            glowOpacity: 0.078,
            cameraZ: 14.2,

            colorA: '#49efff',
            colorB: '#fff8fb',
            colorC: '#9b5cff'
        };

        const TAU = Math.PI * 2;
        const lineSegments = 180;
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.017);

        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, config.cameraZ);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
        renderer.setClearColor(0x000000, 1);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            config.bloomStrength,
            config.bloomRadius,
            config.bloomThreshold
        );
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        const lineGroup = new THREE.Group();
        const particleGroup = new THREE.Group();
        scene.add(lineGroup, particleGroup);

        const lineRecords = [];
        let particles;
        let particlesData = [];

        function hexColor(value) {
            return new THREE.Color(value);
        }

        function mixColors(t, offset = 0) {
            const a = hexColor(config.colorA);
            const b = hexColor(config.colorB);
            const c = hexColor(config.colorC);
            const pulse = (Math.sin((t + offset) * TAU) + 1) * 0.5;
            return pulse < 0.5 ? a.lerp(b, pulse * 2) : b.lerp(c, (pulse - 0.5) * 2);
        }

        function leftEdgeTaper(t) {
            return Math.min(Math.pow(t * config.taperSharpness, 2), 1);
        }

        function getTentaclePosition(tentacleIndex, t, time, phase = 0) {
            const centeredIndex = tentacleIndex - (config.tentacleCount - 1) * 0.5;
            const indexNorm = config.tentacleCount <= 1 ? 0 : centeredIndex / ((config.tentacleCount - 1) * 0.5);
            const taper = leftEdgeTaper(t);
            const lengthBias = Math.pow(t, 1.18);
            const x = THREE.MathUtils.lerp(-10.85, 10.6, lengthBias) + config.offsetX;
            const groupOffset = centeredIndex * (config.groupSpacing / Math.max(config.tentacleCount - 1, 1));

            const wave = time * config.waveSpeed + phase + indexNorm * 0.9;
            const curl = t * TAU * (1.4 + config.curlFrequency * 4.0) + wave;
            const secondary = t * TAU * 2.35 - wave * 0.58;
            const amplitude = config.writhingAmplitude * taper * (0.36 + t * 0.78);

            const y =
                config.offsetY +
                groupOffset * taper +
                Math.sin(curl) * amplitude +
                Math.sin(secondary) * amplitude * 0.26;

            const z =
                Math.cos(curl * 0.83 + phase) * amplitude * 0.48 +
                Math.sin(secondary * 0.5) * taper * 0.24;

            return new THREE.Vector3(x, y, z);
        }

        function makeLineRecord(tentacleIndex, phase, radius, opacity, colorOffset, isCore) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array((lineSegments + 1) * 3);
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.LineBasicMaterial({
                color: mixColors(tentacleIndex / Math.max(config.tentacleCount - 1, 1), colorOffset),
                transparent: true,
                opacity,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const line = new THREE.Line(geometry, material);
            line.frustumCulled = false;
            lineGroup.add(line);

            return {
                line,
                tentacleIndex,
                phase,
                radius,
                colorOffset,
                isCore,
                positions
            };
        }

        function updateLineRecord(record, time) {
            for (let i = 0; i <= lineSegments; i++) {
                const t = i / lineSegments;
                const taper = leftEdgeTaper(t);
                const base = getTentaclePosition(record.tentacleIndex, t, time, record.phase);
                const orbit = record.phase + t * TAU * (1.35 + config.curlFrequency * 1.8) + time * 0.34;
                const radius = record.radius * config.spread * taper * (0.16 + t * 0.92);
                const idx = i * 3;

                record.positions[idx] = base.x;
                record.positions[idx + 1] = base.y + Math.cos(orbit) * radius;
                record.positions[idx + 2] = base.z + Math.sin(orbit) * radius * 0.72;
            }

            record.line.geometry.attributes.position.needsUpdate = true;
            record.line.material.color.copy(mixColors(record.tentacleIndex / Math.max(config.tentacleCount - 1, 1), record.colorOffset));
            record.line.material.opacity = record.isCore ? config.coreOpacity : config.glowOpacity;
        }

        function clearObject(object) {
            while (object.children.length) {
                const child = object.children.pop();
                child.geometry?.dispose();
                child.material?.dispose();
            }
        }

        function buildLines() {
            clearObject(lineGroup);
            lineRecords.length = 0;

            for (let tentacle = 0; tentacle < config.tentacleCount; tentacle++) {
                for (let i = 0; i < config.glowLinesPerTentacle; i++) {
                    const p = i / Math.max(config.glowLinesPerTentacle - 1, 1);
                    const phase = p * TAU + tentacle * 0.19;
                    const radius = 0.72 + Math.random() * 1.1;
                    lineRecords.push(makeLineRecord(tentacle, phase, radius, config.glowOpacity, p * 0.5, false));
                }

                for (let i = 0; i < config.coreLinesPerTentacle; i++) {
                    const p = i / Math.max(config.coreLinesPerTentacle - 1, 1);
                    const phase = p * TAU + tentacle * 0.12;
                    const radius = 0.09 + p * 0.22;
                    lineRecords.push(makeLineRecord(tentacle, phase, radius, config.coreOpacity, p * 0.18, true));
                }
            }
        }

        function buildParticles() {
            particleGroup.clear();
            particles?.geometry.dispose();
            particles?.material.dispose();
            particlesData = [];

            const positions = new Float32Array(config.particleCount * 3);
            const colors = new Float32Array(config.particleCount * 3);
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            for (let i = 0; i < config.particleCount; i++) {
                const t = Math.random();
                const tentacleIndex = Math.floor(Math.random() * config.tentacleCount);
                const color = mixColors(t, Math.random() * 0.35);
                const colorIndex = i * 3;

                colors[colorIndex] = color.r;
                colors[colorIndex + 1] = color.g;
                colors[colorIndex + 2] = color.b;

                particlesData.push({
                    t,
                    tentacleIndex,
                    angle: Math.random() * TAU,
                    radius: 0.14 + Math.random() * 1.05,
                    speed: config.particleSpeed * (0.5 + Math.random() * 1.4),
                    orbitSpeed: (0.45 + Math.random() * 1.4) * (Math.random() > 0.5 ? 1 : -1)
                });
            }

            const material = new THREE.PointsMaterial({
                size: config.particleSize,
                sizeAttenuation: true,
                vertexColors: true,
                transparent: true,
                opacity: 0.92,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            particles.frustumCulled = false;
            particleGroup.add(particles);
        }

        function updateParticles(time) {
            if (!particles) return;

            const pPositions = particles.geometry.attributes.position.array;
            const pColors = particles.geometry.attributes.color.array;

            for (let i = 0; i < config.particleCount; i++) {
                const pData = particlesData[i];
                pData.t -= pData.speed * config.particleGlobalSpeed;

                if (pData.t < 0) {
                    pData.t = 1;
                    pData.tentacleIndex = Math.floor(Math.random() * config.tentacleCount);
                    pData.radius = 0.14 + Math.random() * 1.05;
                    pData.speed = config.particleSpeed * (0.5 + Math.random() * 1.4);
                }

                const centerPos = getTentaclePosition(pData.tentacleIndex, pData.t, time, 0);
                pData.angle += pData.orbitSpeed * config.particleOrbitSpeed * 0.02;

                const edgeTaper = leftEdgeTaper(pData.t);
                const orbitRadius = pData.radius * config.particleOrbitRadius * edgeTaper * (0.25 + pData.t * 0.9);
                const idx = i * 3;

                pPositions[idx] = centerPos.x;
                pPositions[idx + 1] = centerPos.y + Math.cos(pData.angle) * orbitRadius;
                pPositions[idx + 2] = centerPos.z + Math.sin(pData.angle) * orbitRadius;

                const color = mixColors(pData.t, pData.tentacleIndex * 0.04);
                pColors[idx] = color.r;
                pColors[idx + 1] = color.g;
                pColors[idx + 2] = color.b;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;
            particles.material.size = config.particleSize;
        }

        function rebuildAll() {
            config.tentacleCount = Math.round(config.tentacleCount);
            config.coreLinesPerTentacle = Math.round(config.coreLinesPerTentacle);
            config.glowLinesPerTentacle = Math.round(config.glowLinesPerTentacle);
            config.particleCount = Math.round(config.particleCount);
            buildLines();
            buildParticles();
        }

        function setupGui() {
            const gui = new GUI({ title: 'Ethereal Flow' });
            gui.close();

            const motion = gui.addFolder('Motion');
            motion.add(config, 'waveSpeed', 0, 2, 0.001);
            motion.add(config, 'curlFrequency', 0, 1.2, 0.0005);
            motion.add(config, 'writhingAmplitude', 0, 3, 0.001);

            const layout = gui.addFolder('Layout');
            layout.add(config, 'offsetX', -4, 4, 0.01);
            layout.add(config, 'offsetY', -5, 5, 0.01);
            layout.add(config, 'groupSpacing', 0.5, 10, 0.01);
            layout.add(config, 'taperSharpness', 0.4, 9, 0.001);
            layout.add(config, 'spread', 0.05, 2.5, 0.0005);
            layout.add(config, 'cameraZ', 8, 24, 0.01).onChange(() => {
                camera.position.z = config.cameraZ;
            });

            const structure = gui.addFolder('Structure');
            structure.add(config, 'tentacleCount', 1, 18, 1).onFinishChange(rebuildAll);
            structure.add(config, 'coreLinesPerTentacle', 1, 12, 1).onFinishChange(rebuildAll);
            structure.add(config, 'glowLinesPerTentacle', 0, 80, 1).onFinishChange(rebuildAll);

            const particlesFolder = gui.addFolder('Particles');
            particlesFolder.add(config, 'particleCount', 0, 9000, 100).onFinishChange(rebuildAll);
            particlesFolder.add(config, 'particleSize', 0.005, 0.14, 0.0001);
            particlesFolder.add(config, 'particleSpeed', 0.0001, 0.01, 0.0001);
            particlesFolder.add(config, 'particleGlobalSpeed', 0, 2, 0.001);
            particlesFolder.add(config, 'particleOrbitRadius', 0, 1.5, 0.001);
            particlesFolder.add(config, 'particleOrbitSpeed', 0, 3, 0.001);

            const glow = gui.addFolder('Glow');
            glow.add(config, 'bloomStrength', 0, 4, 0.01).onChange(() => {
                bloomPass.strength = config.bloomStrength;
            });
            glow.add(config, 'bloomRadius', 0, 1.5, 0.01).onChange(() => {
                bloomPass.radius = config.bloomRadius;
            });
            glow.add(config, 'bloomThreshold', 0, 1, 0.001).onChange(() => {
                bloomPass.threshold = config.bloomThreshold;
            });
            glow.add(config, 'coreOpacity', 0, 1, 0.001);
            glow.add(config, 'glowOpacity', 0, 0.3, 0.001);
            glow.addColor(config, 'colorA');
            glow.addColor(config, 'colorB');
            glow.addColor(config, 'colorC');
        }

        function resize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(width, height);
            composer.setSize(width, height);
        }

        function animate(now) {
            const time = now * 0.001;
            for (const record of lineRecords) {
                updateLineRecord(record, time);
            }
            updateParticles(time);
            composer.render();
        }

        buildLines();
        buildParticles();
        setupGui();
        resize();
        renderer.setAnimationLoop(animate);
        window.addEventListener('resize', resize);
    </script>
</body>
</html>
